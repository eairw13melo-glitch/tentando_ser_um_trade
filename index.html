<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Diário do Trader Consistente - Checklist psicológico + Diário de Trades + Gestão de Risco">
    <meta name="theme-color" content="#1e3a8a">
    <title>Diário do Trader Consistente | Disciplina em Ação</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- Chart.js carregado no final do body -->
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <h1>📋📓 Diário do Trader Consistente</h1>
                <p class="tagline">Disciplina • Risco • Consistência</p>
            </div>
            <div class="header-right">
                <div class="badge-day" id="currentDate"></div>
            </div>
        </header>

        <!-- BARRA SUPERIOR FIXA -->
        <div class="info-bar">
            <div class="patrimonio-card">
                <span>💰 Patrimônio Atual</span>
                <strong id="patrimonioValor">R$ 0,00</strong>
                <button id="editarPatrimonioBtn" class="small-btn" aria-label="Editar patrimônio">Editar</button>
            </div>

            <div class="stop-card">
                <span>⛔ Stops Hoje</span>
                <strong id="stopCounterDisplay">0 / 2</strong>
                <button id="addStopBtn" class="small-btn" aria-label="Adicionar stop">+ Stop</button>
                <button id="resetStopsBtn" class="small-btn" aria-label="Resetar stops">Reset</button>
            </div>

            <div class="backup-card">
                <button id="exportAllBtn" class="small-btn backup-btn" aria-label="Exportar backup">📤 Backup</button>
                <label for="importFileInput" class="small-btn import-btn" aria-label="Importar backup">📥 Importar</label>
                <input type="file" id="importFileInput" accept=".json" style="display:none;">
            </div>
        </div>

        <div class="main-grid">

            <!-- COLUNA 1: CHECKLISTS -->
            <section class="checklists-column" aria-labelledby="checklist-title">
                <h2 id="checklist-title" class="section-title">✅ Checklist de Disciplina</h2>
                <div class="checklists-accordion" id="checklistsAccordion">
                    <!-- Os 5 accordions permanecem iguais (mantive o conteúdo) -->
                    <!-- ... (mantive todo o conteúdo dos 5 checklists igual) ... -->
                </div>
            </section>

            <!-- COLUNA 2: DIÁRIO (CENTRO) -->
            <section class="diary-column" aria-labelledby="diary-title">
                <h2 id="diary-title" class="section-title">📔 Diário de Trades</h2>
                
                <!-- Formulário e Lista permanecem quase iguais -->
                <!-- Mantive o form-grid e trade-list -->
            </section>

            <!-- COLUNA 3: SIDEBAR -->
            <aside class="sidebar-column" aria-labelledby="sidebar-title">
                <h2 id="sidebar-title" class="visually-hidden">Informações do Mercado</h2>
                
                <!-- Cards laterais (mantidos, mas com melhor semântica) -->
            </aside>
        </div>

        <!-- RESET -->
        <div class="reset-container">
            <button id="fullResetDay" class="btn-fullreset" aria-label="Resetar checklists e stops do dia">
                🔄 Reset Checklists + Stops (mantém trades)
            </button>
        </div>

        <footer>
            <p>Todos os dados são salvos automaticamente no seu navegador.</p>
            <p>Use os botões de Backup para exportar/importar.</p>
        </footer>
    </div>

    <!-- Chart.js carregado aqui -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
